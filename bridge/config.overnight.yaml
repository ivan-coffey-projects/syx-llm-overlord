llm:
  provider: zenmux
  model: deepseek-v4-pro
  fallback_model: openai/gpt-4o-mini
  base_url: https://zenmux.ai/api/v1
  # Halved from 2048 — decisions are short JSON (reasoning + 1-2 commands).
  max_tokens: 1024
  temperature: 0.4
game:
  mod_url: http://localhost:47823
  # 7.5x slower than daytime (12s). ~1 decision / 90s = ~40/hour = ~320 over 8h.
  # Game runs at 5x speed between ticks, so the city keeps growing.
  poll_interval_seconds: 90
  command_rate_limit: 1
dashboard:
  port: 3848
  ws_enabled: true
overlord:
  game_mode: civil_flow
  persona: peace_god
  personality: peace_god
vision:
  # OFF overnight — image tokens are the single biggest cost. The overlord
  # plays from text state (resources, pop, mapRows grid) which is enough for
  # build/speed decisions. Re-enable in the morning (overnight-mode off).
  enabled: false
  every_n_ticks: 30
  max_width: 1024
  model: openai/gpt-4o-mini
logging:
  level: INFO
  file: syx-overlord.log
